trigger:
- main

pool:
  name: Azure Pipelines
  vmImage: 'windows-2022'
  demands: npm

steps:
- task: Npm@1
  displayName: 'npm install durablefunctionsmonitor.react'
  inputs:
    command: custom
    workingDir: durablefunctionsmonitor.react
    verbose: false
    customCommand: 'install -legacy-peer-deps'

- task: Npm@1
  displayName: 'npm build durablefunctionsmonitor.react'
  inputs:
    command: custom
    workingDir: durablefunctionsmonitor.react
    verbose: false
    customCommand: 'run build'

- task: CopyFiles@2
  displayName: 'copy statics to durablefunctionsmonitor.dotnetisolated/DfmStatics'
  inputs:
    SourceFolder: durablefunctionsmonitor.react/build
    Contents: |
     static/**
     index.html
     favicon.png
     logo.svg
     service-worker.js
     manifest.json
    TargetFolder: durablefunctionsmonitor.dotnetisolated/DfmStatics
    CleanTargetFolder: true

- task: CopyFiles@2
  displayName: 'copy durablefunctionsmonitor.dotnetisolated to ArtifactStagingDirectory'
  inputs:
    SourceFolder: durablefunctionsmonitor.dotnetisolated
    TargetFolder: '$(Build.ArtifactStagingDirectory)/durablefunctionsmonitor.dotnetisolated'
    OverWrite: true

- task: CopyFiles@2
  displayName: 'copy custom-backends to ArtifactStagingDirectory'
  inputs:
    SourceFolder: custom-backends
    TargetFolder: '$(Build.ArtifactStagingDirectory)/custom-backends-src'
    OverWrite: true

- task: DotNetCoreCLI@2
  displayName: 'dotnet test tests/durablefunctionsmonitor.dotnetisolated.core.tests'
  inputs:
    command: 'test'
    projects: 'tests/durablefunctionsmonitor.dotnetisolated.core.tests/*.csproj'

- task: DotNetCoreCLI@2
  displayName: 'dotnet publish durablefunctionsmonitor.dotnetisolated'
  inputs:
    command: publish
    publishWebProjects: false
    projects: durablefunctionsmonitor.dotnetisolated
    arguments: '--output $(Build.ArtifactStagingDirectory)/durablefunctionsmonitor.dotnetisolated/output'
    zipAfterPublish: false
    modifyOutputPath: false

# Custom backends are shipped inside the VSIX as published binaries, because they reference
# durablefunctionsmonitor.dotnetisolated.* by project and so cannot be built from the VSIX itself

- task: DotNetCoreCLI@2
  displayName: 'dotnet publish custom-backends/dotnetIsolated-mssql'
  inputs:
    command: publish
    publishWebProjects: false
    projects: custom-backends/dotnetIsolated-mssql
    arguments: '--output $(Build.ArtifactStagingDirectory)/custom-backends/dotnetIsolated-mssql'
    zipAfterPublish: false
    modifyOutputPath: false

- task: DotNetCoreCLI@2
  displayName: 'dotnet publish custom-backends/dotnetIsolated-netherite'
  inputs:
    command: publish
    publishWebProjects: false
    projects: custom-backends/dotnetIsolated-netherite
    arguments: '--output $(Build.ArtifactStagingDirectory)/custom-backends/dotnetIsolated-netherite'
    zipAfterPublish: false
    modifyOutputPath: false

- task: CopyFiles@2
  displayName: 'copy dotnetisolated to durablefunctionsmonitor-vscodeext/backend'
  inputs:
    SourceFolder: '$(Build.ArtifactStagingDirectory)/durablefunctionsmonitor.dotnetisolated/output'
    Contents: |
     **
     !logo.svg
    TargetFolder: 'durablefunctionsmonitor-vscodeext/backend'
    CleanTargetFolder: true

- task: CopyFiles@2
  displayName: 'copy custom-backends to durablefunctionsmonitor-vscodeext/custom-backends'
  inputs:
    SourceFolder: '$(Build.ArtifactStagingDirectory)/custom-backends'
    Contents: |
     **
     !*.md
    TargetFolder: 'durablefunctionsmonitor-vscodeext/custom-backends'
    CleanTargetFolder: true

- task: Npm@1
  displayName: 'npm install durablefunctionsmonitor-vscodeext'
  inputs:
    workingDir: 'durablefunctionsmonitor-vscodeext'
    verbose: false

- task: Npm@1
  displayName: 'npm install -g azure-functions-core-tools@4'
  inputs:
    command: custom
    workingDir: 'durablefunctionsmonitor-vscodeext'
    customCommand: 'install -g azure-functions-core-tools@4'
    verbose: false

- task: Npm@1
  displayName: 'run tests on durablefunctionsmonitor-vscodeext'
  enabled: false
  inputs:
    command: custom
    workingDir: 'durablefunctionsmonitor-vscodeext'
    verbose: false
    customCommand: 'run test'

- task: Npm@1
  displayName: 'package durablefunctionsmonitor-vscodeext to VSIX-file'
  inputs:
    command: custom
    workingDir: 'durablefunctionsmonitor-vscodeext'
    verbose: false
    customCommand: 'run package'

- task: CopyFiles@2
  displayName: 'copy VSIX-file to ArtifactStagingDirectory'
  inputs:
    SourceFolder: 'durablefunctionsmonitor-vscodeext'
    Contents: 'durablefunctionsmonitor*.vsix'
    TargetFolder: '$(Build.ArtifactStagingDirectory)'
    OverWrite: true

- task: CopyFiles@2
  displayName: 'copy LICENSE.txt to durablefunctionsmonitor.dotnetisolated/output'
  inputs:
    SourceFolder: 'durablefunctionsmonitor.dotnetisolated'
    Contents: 'LICENSE.txt'
    TargetFolder: '$(Build.ArtifactStagingDirectory)/durablefunctionsmonitor.dotnetisolated/output'
    OverWrite: true

- task: NuGetToolInstaller@1
  displayName: 'Install latest nuget.exe'
  inputs:
    versionSpec:

- task: NuGetCommand@2
  displayName: 'package dotnetisolated into a Nuget package'
  inputs:
    command: 'pack'
    packagesToPack: '$(Build.ArtifactStagingDirectory)/durablefunctionsmonitor.dotnetisolated/output/nuspec.nuspec'
    packDestination: '$(Build.ArtifactStagingDirectory)'
    versioningScheme: 'off'

- task: az-func-as-a-graph@1
  displayName: 'Generate az-func-as-a-graph diagram of DurableFunctionsMonitor.DotNetIsolated'
  inputs:
    projectFolder: '$(System.DefaultWorkingDirectory)/durablefunctionsmonitor.dotnetisolated.core'
    outputFile: '$(Build.ArtifactStagingDirectory)/DurableFunctionsMonitor-DotNetIsolated-Diagram.htm'
    repoUri: '$(Build.Repository.Uri)'
    repoName: '$(Build.Repository.Name)'
    branchName: '$(Build.SourceBranchName)'

- task: PublishBuildArtifacts@1
  displayName: 'Publish Artifact: drop'
